name: containers

on:
    workflow_dispatch:


jobs:
  build-amd64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free space
        run: |
          rm -rf /opt/hostedtoolcache
          df -h

      - name: Login to ghcr.io
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Tezos container for amd64
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./containers/tezos/Dockerfile
          platforms: linux/amd64
          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: ghcr.io/tez-capital/tezos:amd64-latest
          push: true
          provenance: false

  build-arm64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free space
        run: |
          rm -rf /opt/hostedtoolcache
          df -h
          
      - name: Login to ghcr.io
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Tezos container for arm64
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./containers/tezos/Dockerfile
          platforms: linux/arm64
          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: ghcr.io/tez-capital/tezos:arm64-latest
          push: true
          provenance: false

  push-multiarch:
    runs-on: ubuntu-22.04
    needs: [build-amd64, build-arm64]
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-architecture manifest
        run: |
          docker manifest create ghcr.io/tez-capital/tezos:latest \
            --amend ghcr.io/tez-capital/tezos:amd64-latest \
            --amend ghcr.io/tez-capital/tezos:arm64-latest
          docker manifest push ghcr.io/tez-capital/tezos:latest